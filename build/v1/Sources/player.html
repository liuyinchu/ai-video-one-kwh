<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>一度电如何来到插座 · 能量观察室</title>
<style>
:root{color-scheme:dark;--ink:#07131b;--muted:#90aab2;--mint:#52efbf}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#f0f7f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1320px;margin:auto;padding:32px 32px 56px}.brand{font-size:12px;letter-spacing:5px;color:var(--mint);margin-bottom:25px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:26px}h1{font-size:clamp(26px,3.5vw,44px);font-weight:650;margin:0 0 12px;letter-spacing:-1px}p{color:var(--muted);line-height:1.75;margin:0}video{width:100%;display:block;background:#07131b;border:1px solid #1e3e4b;border-radius:12px;aspect-ratio:16/9;box-shadow:0 20px 100px #0005}nav{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}a,.chapter{color:var(--mint);text-decoration:none;border:1px solid #2a514e;border-radius:8px;padding:11px 16px;font-size:14px;background:#102629;transition:background .15s}a:hover,.chapter:hover{background:#1e423e}.chapter{font:inherit;text-align:left;cursor:pointer;color:#e8f2ef;font-size:14px;display:flex;align-items:center;gap:13px;border-color:#20353e;background:#0c1c25;padding:15px}.chapter.active{border-color:var(--mint);background:#133a34}.chapter span{font-size:12px;color:var(--mint);font-variant-numeric:tabular-nums}.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 28px}.meta{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:18px 0 0;font-size:13px}.files{display:flex;gap:18px;flex-wrap:wrap}.files a{padding:0;border:0;background:none;color:var(--muted);font-size:13px}footer{border-top:1px solid #20353e;padding-top:22px;color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:780px){main{padding:22px 16px}header{display:block}nav{margin-top:22px}.chapters{grid-template-columns:repeat(2,1fr)}.meta{align-items:start;flex-direction:column}}
</style>
</head>
<body><main>
<div class="brand">能 量 观 察 室</div>
<header><div><h1>一度电如何来到插座</h1><p>从能量转换到电网平衡，一次看懂电的旅程。</p></div><nav><a href="one-kwh.mp4" download="一度电如何来到插座.mp4">下载 MP4 ↗</a></nav></header>
<video id="film" controls preload="metadata" playsinline poster="previews/scene-01.png"><source src="one-kwh.mp4" type="video/mp4">请下载 MP4 后播放。</video><p id="playback-note" style="display:none;margin:14px 0;color:#ffb86b">当前浏览器未能播放此视频。请点击“下载 MP4”，用系统播放器打开。</p>
<div class="meta"><p id="runtime">1080p · 24 fps · 中文旁白与字幕</p><div class="files"><a href="subtitles.srt" download>字幕 SRT</a><a href="script.md">完整脚本</a><a href="sources.md">事实核查与来源</a></div></div>
<div class="chapters" id="chapters" aria-label="视频章节"></div>
<footer>本片采用原创矢量动画与系统合成中文旁白。电网结构与波形为教学示意，具体接线和电压等级因地区而异。</footer>
</main>
<script>
const video=document.getElementById('film');const list=document.getElementById('chapters');
video.addEventListener('error',()=>{document.getElementById('playback-note').style.display='block';console.error('Film playback',video.error?.code,video.error?.message)});
fetch('timeline.json').then(r=>r.json()).then(data=>{
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
document.getElementById('runtime').textContent=`${fmt(Math.round(data.duration))} · 1920 × 1080 · 24 fps · 中文旁白与字幕`;
data.scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='chapter';b.innerHTML=`<span>${fmt(s.start)}</span>${s.title}`;b.onclick=()=>{video.currentTime=s.start+.6;video.play()};list.appendChild(b)});
video.addEventListener('timeupdate',()=>Array.from(list.children).forEach((b,i)=>b.classList.toggle('active',video.currentTime>=data.scenes[i].start&&video.currentTime<data.scenes[i].end)));
}).catch(()=>{});
</script></body></html>
